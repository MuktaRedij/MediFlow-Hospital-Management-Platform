# Ansible Configuration File
# Global Ansible settings

[defaults]
# Inventory settings
inventory = ./ansible/inventory/staging.ini
host_key_checking = False

# Execution settings
remote_user = ubuntu
timeout = 30
forks = 5

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# SSH settings
private_key_file = ~/.ssh/mediflow-key
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Logging
log_path = ./ansible/logs/ansible.log
display_skipped_hosts = False

# Plugins
library = ./ansible/library
module_utils = ./ansible/module_utils
filter_plugins = ./ansible/filter_plugins
callback_plugins = ./ansible/callback_plugins

# Handlers
handler_includes_static = False

# Vault
vault_identity_list = default@prompt

# Retry settings
retry_files_enabled = True
retry_files_save_path = ./ansible/logs

# Variable precedence
precedence = default,environment,variable,extra

[inventory]
enable_plugins = ini, yaml, aws_ec2

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
