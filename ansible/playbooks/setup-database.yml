# Setup PostgreSQL Database
# Configures PostgreSQL server and creates databases
---
- name: Setup PostgreSQL Database
  hosts: databases
  become: yes
  
  tasks:
    - name: Install PostgreSQL packages
      block:
        - name: Add PostgreSQL repository key
          apt_key:
            url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
            state: present
          when: ansible_os_family == "Debian"
        
        - name: Add PostgreSQL repository
          apt_repository:
            repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
            state: present
          when: ansible_os_family == "Debian"
        
        - name: Install PostgreSQL
          package:
            name: "postgresql-{{ postgresql_version }}"
            state: present
        
        - name: Install PostgreSQL contrib
          package:
            name: "postgresql-contrib-{{ postgresql_version }}"
            state: present
        
        - name: Install PostgreSQL client
          package:
            name: postgresql-client
            state: present
    
    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes
        daemon_reload: yes
    
    - name: Configure PostgreSQL
      block:
        - name: Update postgresql.conf
          lineinfile:
            path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
            regexp: "^#?{{ item.key }}\\s*="
            line: "{{ item.key }} = {{ item.value }}"
            state: present
          loop:
            - { key: "listen_addresses", value: "'*'" }
            - { key: "max_connections", value: "{{ postgresql_max_connections }}" }
            - { key: "shared_buffers", value: "{{ postgresql_shared_buffers }}" }
            - { key: "effective_cache_size", value: "{{ postgresql_effective_cache_size }}" }
            - { key: "work_mem", value: "{{ postgresql_work_mem }}" }
            - { key: "log_statement", value: "'all'" }
            - { key: "ssl", value: "on" }
          notify: restart postgresql
        
        - name: Update pg_hba.conf for authentication
          lineinfile:
            path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
            line: "host    all             all             0.0.0.0/0               md5"
            insertbefore: "^# IPv4 local connections"
            state: present
          notify: restart postgresql
    
    - name: Create MediFlow database user
      block:
        - name: Create database user
          postgresql_user:
            name: "{{ db_user }}"
            password: "{{ db_password }}"
            login_user: postgres
            state: present
        
        - name: Alter user privileges
          postgresql_privs:
            role: "{{ db_user }}"
            objs: ALL_DEFAULT
            privs: CONNECT
            db: postgres
            login_user: postgres
    
    - name: Create MediFlow database
      postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        encoding: UTF-8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        login_user: postgres
        state: present
    
    - name: Enable PostgreSQL extensions
      postgresql_ext:
        name: "{{ item }}"
        db: "{{ db_name }}"
        login_user: postgres
        state: present
      loop:
        - uuid-ossp
        - pgcrypto
        - pg_trgm
    
    - name: Setup backup
      block:
        - name: Create backup directory
          file:
            path: "/var/backups/postgresql"
            state: directory
            owner: postgres
            group: postgres
            mode: '0700'
        
        - name: Create backup script
          template:
            src: pg_backup.sh.j2
            dest: "/usr/local/bin/pg_backup.sh"
            mode: '0755'
            owner: root
            group: root
        
        - name: Schedule daily backup
          cron:
            name: "Daily PostgreSQL backup"
            minute: "0"
            hour: "2"
            job: "/usr/local/bin/pg_backup.sh"
            user: postgres
            state: present
    
    - name: Setup monitoring
      block:
        - name: Enable pg_stat_statements
          postgresql_ext:
            name: pg_stat_statements
            db: "{{ db_name }}"
            login_user: postgres
            state: present
        
        - name: Create monitoring role
          postgresql_user:
            name: monitoring
            password: "{{ vault_monitoring_password }}"
            login_user: postgres
            state: present
        
        - name: Grant monitoring privileges
          postgresql_privs:
            role: monitoring
            objs: "{{ db_name }}"
            privs: CONNECT
            db: postgres
            login_user: postgres
  
  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted
        daemon_reload: yes
