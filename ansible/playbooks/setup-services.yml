# Email Service Configuration
# Sets up email service for notifications
---
- name: Setup Email Service
  hosts: email_service
  become: yes
  
  tasks:
    - name: Install email service dependencies
      package:
        name: "{{ item }}"
        state: present
      loop:
        - nodejs
        - npm
        - git
        - python3
        - python3-pip
    
    - name: Create email service directory
      file:
        path: "/opt/email-service"
        state: directory
        owner: nobody
        group: nogroup
        mode: '0755'
    
    - name: Clone email service repository
      git:
        repo: "{{ email_service_repo_url }}"
        dest: "/opt/email-service"
        version: main
        accept_hostkey: yes
    
    - name: Install email service dependencies
      block:
        - name: Install npm dependencies
          npm:
            path: /opt/email-service
            state: present
        
        - name: Install Python dependencies
          pip:
            requirements: "/opt/email-service/requirements.txt"
            state: present
    
    - name: Configure email service
      template:
        src: email_service.env.j2
        dest: "/opt/email-service/.env"
        owner: nobody
        group: nogroup
        mode: '0600'
    
    - name: Create email service systemd unit
      template:
        src: email-service.service.j2
        dest: "/etc/systemd/system/email-service.service"
        mode: '0644'
      notify: restart email service
    
    - name: Enable and start email service
      systemd:
        name: email-service
        state: started
        enabled: yes
        daemon_reload: yes
  
  handlers:
    - name: restart email service
      systemd:
        name: email-service
        state: restarted
        daemon_reload: yes
