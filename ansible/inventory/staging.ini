# Staging Inventory
# Defines hosts for staging environment
[webservers]
mediflow-staging-web-01 ansible_host=10.1.1.10 ansible_user=ubuntu

[databases]
mediflow-staging-db-01 ansible_host=10.1.2.10 ansible_user=ubuntu

[email_service]
mediflow-staging-email-01 ansible_host=10.1.3.10 ansible_user=ubuntu

# Group definitions
[webservers:vars]
environment=staging
max_connections=50

[databases:vars]
environment=staging
backup_enabled=true

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/mediflow-staging.pem
ansible_ssh_common_args="-o StrictHostKeyChecking=no"
