# Production Inventory
# Defines hosts for production environment
[webservers]
mediflow-prod-web-01 ansible_host=10.0.1.10 ansible_user=ubuntu
mediflow-prod-web-02 ansible_host=10.0.1.11 ansible_user=ubuntu

[databases]
mediflow-prod-db-01 ansible_host=10.0.2.10 ansible_user=ubuntu

[email_service]
mediflow-prod-email-01 ansible_host=10.0.3.10 ansible_user=ubuntu

[loadbalancer]
mediflow-prod-lb-01 ansible_host=10.0.1.1 ansible_user=ubuntu

# Group definitions
[webservers:vars]
environment=production
max_connections=200

[databases:vars]
environment=production
backup_enabled=true

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/mediflow-prod.pem
ansible_ssh_common_args="-o StrictHostKeyChecking=no"
